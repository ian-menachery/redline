name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # requirements.txt carries the runtime deps + an editable install of
          # the package (`-e .`); ruff/mypy are the dev tools.
          pip install -r requirements.txt
          pip install ruff mypy
      - name: Lint (ruff)
        run: ruff check .
      - name: Type-check (mypy)
        run: mypy src/redline
      - name: Test (pytest)
        run: pytest -q
