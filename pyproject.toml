[project]
name = "redline"
version = "0.2.0"
description = "Scheduled SEC EDGAR monitoring with QoQ section diffs + Form 4 correlation."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8", "pytest-cov>=5"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["redline"]
omit = ["*/__main__.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
# spike/ holds throwaway feasibility diagnostics, not shipped code.
extend-exclude = ["spike"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is not enforced (long SQL strings / provenance comments are
# clearer unwrapped); the editor/formatter handles wrapping. The valuable E
# rules (imports-at-top, statement style) stay on.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# __init__.py re-exports are intentional.
"__init__.py" = ["F401"]

[tool.mypy]
# No python_version pin: each CI matrix job analyzes with its own interpreter
# (3.11 + 3.12), which also keeps mypy in step with the version-specific stubs
# installed on that runner. The 3.11 job enforces our >=3.11 floor.
files = ["src/redline"]
# edgartools / streamlit / openai-beta surfaces are untyped or partially typed.
ignore_missing_imports = true
# Pragmatic baseline for a first pass; tighten (disallow_untyped_defs) later.
warn_unused_ignores = true
warn_redundant_casts = true

# Don't type-check third-party internals we don't own. numpy/pandas ship
# py.typed stubs (transitive via edgartools) we never use directly; skip
# following them. Note: the bare package names are required (a `numpy.*` glob
# does not match top-level `numpy`), and follow_imports_for_stubs is required
# to skip .pyi stub packages.
[[tool.mypy.overrides]]
module = ["numpy", "numpy.*", "pandas", "pandas.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
