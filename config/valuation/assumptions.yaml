# DCF assumptions for the 6 non-financial watchlist names.
# Banks (SCHW, KEY) are intentionally absent — unlevered-FCF DCF is wrong for
# financials (NOTES.md §6).
#
# COST-OF-CAPITAL & REFERENCE PRICES — VERIFIED by Ian, transcribed 2026-07-28.
# `is_placeholder: false` on all 6 (Rf/ERP/beta sourced offline; see per-company
# provenance comments below — these are the audit trail).
#   GLOBAL inputs behind each WACC (provenance; the config stores the resulting
#   per-company `wacc` constant, not the components — §4 "no market-data feed"):
#     - Rf = 4.65%   (FRED DGS10, 2026-07-27)
#     - ERP = 4.50%  (Damodaran)
#     - statutory tax = 21%  (encoded per-company as `tax_rate: 0.21`)
#   reference_price = a dated MANUAL market price (Ian-set, 2026-07-27); not a
#   feed. Still GROUNDED in reported XBRL (unchanged this pass): revenue_growth,
#   operating_margin, capex_pct_revenue, known_fcf. Forward margin ASSUMPTIONS
#   for the currently-unprofitable names (NET, CVNA, MRNA) are unchanged.
#
# nwc_pct_revenue = OPERATING working capital as a fraction of revenue.
# revenue_growth: per projection year (fades toward terminal); shorter lists are
# padded with the last value to the horizon.

