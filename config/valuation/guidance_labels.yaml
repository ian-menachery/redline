# Gold labels + registration manifest for the 8-K guidance-extraction eval.
#
# FILE SHAPE (v2, 2026-07-30): a mapping with two keys —
#   registration: the mechanically-selected, locked panel of earnings-8-K
#                 accessions the eval scores (Rule R below).
#   labels:       the per-figure gold (unchanged schema; scope=total only).
# `load_gold` reads `labels`; a bare top-level list is still accepted for
# backward compatibility.
#
# ---------------------------------------------------------------------------
# GOLD PROVENANCE / SCOPING (unchanged from v1):
#   Curated by reading each EX-99.x earnings release INDEPENDENTLY of the
#   extractor output (circularity guard). Each entry is a top-level forward
#   guidance figure with its real accession.
#   - Included: top-level PERIOD guidance — total revenue, operating income
#     (by basis), EPS, adjusted FCF, adjusted EBITDA — with an explicit fiscal
#     period and a numeric point/range.
#   - Excluded (an extractor emission here counts as a FALSE POSITIVE): revenue
#     SUB-SEGMENTS, one-time charges, long-term ASPIRATIONS, operational metrics.
#   - basis: unqualified "total revenue" -> unspecified; explicitly-qualified
#     items -> non_gaap / adjusted. Adjusted FCF -> metric: other.
#   - period format matches the extractor prompt: FY2026, Q2FY2026, etc.
#   - Accessions with NO quantitative period guidance -> zero gold entries; they
#     test whether the extractor hallucinates.
#
# INDEPENDENCE SCOPE (2026-07-30, decision (a)): the "independent EX-99.x read"
# claim applies ONLY to previously_observed=false accessions. The pre-seen
# PLTR/NET/CVNA gold (curated 2026-07-28) is inherited AS-IS under
# previously_observed=true; NO independence is claimed for it, because its
# extractions had already been observed and independence is not verifiable
# after the fact.
#
# AUDIT LOG (2026-07-28, fix #2): revenue basis gaap -> unspecified on all 10
# revenue entries — every revenue figure is stated as plain "Revenue of ..."
# with no GAAP/non-GAAP qualifier, so faithful transcription is `unspecified`.
# ---------------------------------------------------------------------------

registration:
  # Rule R — the mechanical selection rule, LOCKED before scoring. Given this
  # rule and the committed DB, the panel is reproducible by anyone with zero
  # discretion. Selection is a pure DB read (no network); qualification flags
  # (item 2.02 + EX-99.x) are persisted at backfill time.
  rule: >
    Company set = watchlist rows whose sector NOT IN dcf_excluded_sectors.
    Qualifying filing = a plain 8-K (form exactly 8-K, NOT 8-K/A — an amendment
    re-states an existing earnings event, not a new one) with item 2.02 AND an
    EX-99.x exhibit (flags persisted in earnings_8k_qualification at backfill
    time). Selection = the 2 most recent qualifying filings per company by
    filed_at descending, ties broken by accession ascending, as of locked_at.
  dcf_excluded_sectors: [financials]
  per_company: 2
  # Selected by redline.valuation.guidance_registration.select_registration over
  # the backfilled DB, as of locked_at. previously_observed is COMPUTED per
  # accession (a prior extracted_figures / guidance_runs artifact exists), never
  # hand-assigned. n = 12 (2 per DCF-eligible name; no undershoot).
  locked_at: "2026-07-30T13:58:28Z"
  accessions:
    - {ticker: CVNA, accession: "0001690820-26-000054", filed_at: "2026-07-29", previously_observed: false}
    - {ticker: CVNA, accession: "0001690820-26-000034", filed_at: "2026-04-29", previously_observed: true}
    - {ticker: MRNA, accession: "0001682852-26-000057", filed_at: "2026-05-01", previously_observed: false}
    - {ticker: MRNA, accession: "0001682852-26-000015", filed_at: "2026-02-13", previously_observed: false}
    - {ticker: NET,  accession: "0001477333-26-000033", filed_at: "2026-05-07", previously_observed: false}
    - {ticker: NET,  accession: "0001477333-26-000008", filed_at: "2026-02-10", previously_observed: true}
    - {ticker: PLTR, accession: "0001321655-26-000026", filed_at: "2026-05-04", previously_observed: true}
    - {ticker: PLTR, accession: "0001321655-26-000004", filed_at: "2026-02-02", previously_observed: true}
    - {ticker: ULTA, accession: "0001104659-26-069464", filed_at: "2026-06-02", previously_observed: false}
    - {ticker: ULTA, accession: "0001104659-26-027061", filed_at: "2026-03-12", previously_observed: false}
    - {ticker: VRTX, accession: "0000875320-26-000171", filed_at: "2026-05-04", previously_observed: false}
    - {ticker: VRTX, accession: "0000875320-26-000034", filed_at: "2026-02-12", previously_observed: false}

