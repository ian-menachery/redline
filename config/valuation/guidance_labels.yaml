# Gold labels for the 8-K guidance-extraction eval (precision/recall).
# Curated 2026-07-28 by reading each EX-99.1 earnings release INDEPENDENTLY of
# the extractor output (circularity guard). Each entry is a top-level forward
# guidance figure with its real accession.
#
# SCOPING (documented, principled):
#   - Included: top-level PERIOD guidance — total revenue, operating income
#     (by basis), EPS, adjusted FCF, adjusted EBITDA — with an explicit fiscal
#     period and a numeric point/range.
#   - Excluded (an extractor emission here counts as a FALSE POSITIVE, which is
#     the correct signal for a DCF-driving extractor): revenue SUB-SEGMENTS
#     (e.g. PLTR "U.S. commercial revenue in excess of $X"), one-time charges
#     (NET restructuring), long-term ASPIRATIONS (CVNA "13.5% by 2030-2035"),
#     and operational metrics (unit counts, site counts).
#   - basis: "total revenue" is recorded as GAAP (unqualified revenue is a GAAP
#     measure by convention); items the filing labels "Non-GAAP"/"Adjusted" get
#     non_gaap/adjusted. Adjusted FCF has no metric slot -> metric: other.
#   - period format matches the extractor prompt: FY2026, Q2FY2026, etc.
#   - CVNA Feb/Apr releases carry NO quantitative period guidance (qualitative
#     only) -> zero gold entries; they test whether the extractor hallucinates.
#
# AUDIT LOG (2026-07-28, fix #2): revenue basis gaap -> unspecified, all 10
# revenue entries. Justification (re-verified against each source EX-99.1):
# every revenue figure is stated as plain "Revenue of between $X" (PLTR) or
# "Total revenue of $X to $Y" (NET) with NO "GAAP"/"non-GAAP" qualifier in the
# filing text -> faithful transcription is `unspecified`. The prior `gaap` was
# an accounting inference beyond the text. Non-revenue bases are UNCHANGED
# (op-income "Adjusted"/"Non-GAAP", eps "Non-GAAP", ebitda "Adjusted", FCF
# "adjusted" all carry explicit qualifiers in-text). No revenue figure carried
# a qualifier, so the change is applied uniformly and faithfully — not to make
# figures pass.

