# Runtime settings for redline. Loaded into `RedlineConfig` (Pydantic) via
# `src/redline/config.py`. See ARCHITECTURE.md §13 for the configuration model
# and CLAUDE.md §9 for LLM usage conventions.

[llm]
# Active provider on process start. Falls over to anthropic on
# insufficient_quota — see ARCHITECTURE.md §9 (Provider Fallover).
provider = "openai"
# Hard spending cap ($). The client refuses any LLM call once cumulative logged
# spend (SUM(cost_usd) in llm_call_log for the DB in use) reaches this. Counts
# ALL prior spend in that DB — e.g. data/redline.db already holds ~$1.27 from
# Phase 1, so ~$1.73 of headroom remains under a $3 cap. Scratch/in-memory DBs
# start at $0. Overshoot is bounded by one in-flight call (cents).
max_spend_usd = 3.0

[llm.openai]
cheap_model   = "gpt-4o-mini"  # Stage 2 diff gate, etc.
quality_model = "gpt-4o"       # Stage 3 summary, correlator, judge

[llm.anthropic]
cheap_model   = "claude-haiku-4-5"
quality_model = "claude-sonnet-4-6"

[diff]
# Stage 1 thresholds. min_words=22 is the candidate from PLTR FY22-vs-FY23
# evidence (NOTES.md §1); revisit after Phase 1 eval.
min_words              = 22
normalize_tokens       = true
number_only_skip       = true
materiality_threshold  = 0.6
comparison_strategy    = "most_recent_same_type"

[correlator]
# ±14d join window between filing events and Form 4 transactions
# (ARCHITECTURE.md §5).
window_days = 14

[poller]
# 15-minute cadence (ARCHITECTURE.md §2). UA format per NOTES.md §4.
cadence_seconds  = 900
edgar_user_agent = "Redline (hatcher.ry@northeastern.edu)"

[storage]
db_path = "data/redline.db"

[valuation]
# DCF valuation layer (Subsystem 7). Per-company drivers/WACC/terminal/
# reference_price/known_fcf live in assumptions_path; these are global knobs.
# See NOTES.md §6 (Phase 0 findings) and ARCHITECTURE.md.
projection_years         = 5
terminal_growth_default  = 0.025   # per-company assumptions.yaml overrides this
sensitivity_band_pct     = 0.02
assumptions_path         = "config/valuation/assumptions.yaml"
fcf_mapping_path         = "config/valuation/fcf_mapping_v1.yaml"
fcf_validation_tolerance = 0.10    # reconstructed vs known_fcf; above -> unvalidated base
reference_price_stale_days = 120
min_trigger_confidence   = 0.75    # 8-K guidance below this -> manual_review, not a revaluation trigger
